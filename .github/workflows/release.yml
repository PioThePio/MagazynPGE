name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --frozen
      - run: npm ci --no-audit --no-fund
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/check_release.py --tag "$RELEASE_TAG"
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest -q
      - run: npm test
      - run: npm run check
      - run: uv run --frozen python scripts/build_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/MagazynPGE-*.zip
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Publish the tested GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/MagazynPGE-*.zip --verify-tag --title "MagazynPGE $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
