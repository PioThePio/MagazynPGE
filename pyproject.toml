[project]
name = "magazyn-pge"
version = "0.6.0"
description = "Wirtualny magazyn energii PGE dla Home Assistant"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant==2026.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    "aiohttp",
    "home-assistant-frontend==20260930.2",
    "infrared-protocols==10.1.0",
    "ha-ffmpeg==3.2.2",
    "rf-protocols==4.3.0",
    "pyturbojpeg==1.8.3",
    "av==19.0.0",
    "numpy==2.3.2",
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "mutagen==1.48.1",
    "colorlog==6.10.1",
    "aiohasupervisor==0.6.0",
    "playwright>=1.58,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
